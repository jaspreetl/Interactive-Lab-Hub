<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Roosevelt Transit Lens</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-bottom: 20px;
        }

        header {
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
        }

        /* Roosevelt Island F Train Section */
        .roosevelt-section {
            margin-bottom: 30px;
        }

        .station-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .station-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #FF6319;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: white;
        }

        .station-name h2 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .station-status {
            font-size: 13px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            display: inline-block;
        }

        .station-status.normal {
            background: rgba(39, 174, 96, 0.2);
            color: #27ae60;
        }

        .station-status.delays {
            background: rgba(241, 196, 15, 0.2);
            color: #f1c40f;
        }

        .station-status.problems {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
        }

        .trains-by-direction {
            margin-bottom: 25px;
        }

        .direction-header {
            font-size: 18px;
            color: #fff;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .train-item {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .train-item.next {
            background: #252525;
            border: 2px solid #FF6319;
        }

        .train-time {
            font-size: 24px;
            font-weight: 700;
            color: #FF6319;
        }

        .train-info {
            color: #aaa;
            font-size: 14px;
        }

        .no-trains {
            text-align: center;
            color: #888;
            padding: 30px;
            background: #1a1a1a;
            border-radius: 12px;
        }

        /* Weather Card */
        .weather-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .weather-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .weather-icon {
            width: 48px;
            height: 48px;
        }

        .weather-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: brightness(1.2);
        }

        .weather-info h3 {
            font-size: 20px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .weather-info p {
            font-size: 14px;
            opacity: 0.9;
        }

        .weather-status {
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .weather-status p {
            font-size: 13px;
            opacity: 0.85;
            font-weight: 500;
        }

        .last-updated {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 30px;
            padding: 20px;
        }

        .refresh-btn {
            color: #3498db;
            cursor: pointer;
            text-decoration: underline;
        }

        /* Detail View */
        .detail-view {
            display: none;
        }

        .back-btn {
            background: #1a1a1a;
            color: #3498db;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .detail-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .alerts-section {
            margin-top: 30px;
        }

        .alerts-section h3 {
            font-size: 16px;
            color: #888;
            margin-bottom: 15px;
        }

        .alert-item {
            background: #1a1a1a;
            border-left: 4px solid #27ae60;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .alert-item.problem {
            border-left-color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container" id="main-view">
        <!-- Status Bar -->
        <div class="status-bar">
            <span id="current-time">--:--</span>
            <span>WiFi • <span id="battery">100%</span></span>
        </div>

        <!-- Header -->
        <header>
            <h1>Transit Status</h1>
            <p class="subtitle">Roosevelt Island</p>
        </header>

        <!-- Roosevelt Island F Train Section -->
        <div class="roosevelt-section">
            <div class="station-header">
                <div class="station-icon">F</div>
                <div class="station-name">
                    <h2>Roosevelt Island</h2>
                    <span class="station-status normal" id="roosevelt-status">On Time</span>
                </div>
            </div>

            <!-- Trains by Direction -->
            <div id="roosevelt-trains">
                <div class="no-trains">Loading train data...</div>
            </div>
        </div>

        <!-- Weather Card -->
        <div class="weather-card">
            <div class="weather-header">
                <div class="weather-icon" id="weather-icon">
                    <img src="{{ url_for('static', filename='images/weather.png') }}" alt="Weather icon">
                </div>
                <div class="weather-info">
                    <h3 id="weather-condition">Loading...</h3>
                    <p id="weather-details">-- • Wind: --</p>
                </div>
            </div>
            <div class="weather-status">
                <p id="travel-conditions">Checking conditions</p>
            </div>
        </div>

        <!-- Last Updated -->
        <div class="last-updated">
            Updated <span id="last-update">--</span> ago • <span class="refresh-btn" onclick="forceRefresh()">Tap to refresh</span>
        </div>
    </div>

    <!-- Detail View (for touched stations) -->
    <div class="container detail-view" id="detail-view" style="display: none;">
        <div class="status-bar">
            <span id="detail-time">--:--</span>
            <span>WiFi • 100%</span>
        </div>

        <button class="back-btn" onclick="hideDetail()">← Back</button>

        <div class="detail-header" id="detail-header">
            <!-- Will be populated dynamically -->
        </div>

        <div class="detail-content" id="detail-content">
            <!-- Will be populated dynamically -->
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
