<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Roosevelt Transit Lens</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-bottom: 20px;
        }

        header {
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
        }

        .overall-status {
            text-align: center;
            margin: 40px 0;
        }

        .status-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .status-circle.normal {
            background: rgba(39, 174, 96, 0.2);
            color: #27ae60;
            border: 3px solid #27ae60;
        }

        .status-circle.delays {
            background: rgba(241, 196, 15, 0.2);
            color: #f1c40f;
            border: 3px solid #f1c40f;
        }

        .status-circle.problems {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 3px solid #e74c3c;
        }

        #status-text {
            font-size: 18px;
            font-weight: 600;
        }

        #status-text.normal { color: #27ae60; }
        #status-text.delays { color: #f1c40f; }
        #status-text.problems { color: #e74c3c; }

        .transit-card {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .transit-card:active {
            transform: scale(0.98);
            background: #252525;
        }

        .transit-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .f-train-icon {
            background: #ff6319;
            color: #fff;
        }

        .transit-info {
            flex: 1;
        }

        .transit-info h3 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .status-label {
            font-size: 13px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            display: inline-block;
        }

        .status-label.normal {
            background: rgba(39, 174, 96, 0.2);
            color: #27ae60;
        }

        .status-label.delays {
            background: rgba(241, 196, 15, 0.2);
            color: #f1c40f;
        }

        .status-label.problems {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
        }

        .transit-time {
            text-align: right;
        }

        .time-label {
            font-size: 11px;
            color: #888;
            margin-bottom: 5px;
        }

        .time-value {
            font-size: 24px;
            font-weight: 700;
        }

        .weather-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .weather-icon {
            font-size: 48px;
        }

        .weather-info h3 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .weather-info p {
            font-size: 13px;
            opacity: 0.9;
        }

        .weather-status {
            margin-top: 10px;
            font-size: 12px;
            opacity: 0.8;
        }

        .last-updated {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 30px;
            padding: 20px;
        }

        .refresh-btn {
            color: #3498db;
            cursor: pointer;
            text-decoration: underline;
        }

        .detail-view {
            display: none;
        }

        .back-btn {
            background: #1a1a1a;
            color: #3498db;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .detail-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .upcoming-trains h3 {
            font-size: 16px;
            color: #888;
            margin-bottom: 15px;
        }

        .train-item {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .train-item.next {
            background: #252525;
            border: 2px solid #3498db;
        }

        .train-time {
            font-size: 24px;
            font-weight: 700;
            color: #3498db;
        }

        .train-info {
            color: #aaa;
            font-size: 14px;
        }

        .alerts-section {
            margin-top: 30px;
        }

        .alerts-section h3 {
            font-size: 16px;
            color: #888;
            margin-bottom: 15px;
        }

        .alert-item {
            background: #1a1a1a;
            border-left: 4px solid #27ae60;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .alert-item.problem {
            border-left-color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container" id="main-view">
        <!-- Status Bar -->
        <div class="status-bar">
            <span id="current-time">--:--</span>
            <span>WiFi • <span id="battery">100%</span></span>
        </div>

        <!-- Header -->
        <header>
            <h1>Transit Status</h1>
            <p class="subtitle">Roosevelt Island • <span id="update-time">Now</span></p>
        </header>

        <!-- Overall Status Indicator -->
        <div class="overall-status" id="overall-status">
            <div class="status-circle" id="status-circle">
                <span id="status-icon">OK</span>
            </div>
            <p id="status-text">All Systems Normal</p>
        </div>

        <!-- F Train Card - Updated to pass station ID and line -->
        <div class="transit-card" onclick="showDetail('F09', 'F')">
            <div class="transit-icon f-train-icon">
                <span>F</span>
            </div>
            <div class="transit-info">
                <h3>F Train</h3>
                <p class="status-label" id="f-train-status">On Time</p>
            </div>
            <div class="transit-time">
                <p class="time-label">Next train</p>
                <p class="time-value" id="f-train-time">--</p>
            </div>
        </div>

        <!-- Weather Card -->
        <div class="weather-card">
            <div class="weather-icon" id="weather-icon">⛅</div>
            <div class="weather-info">
                <h3 id="weather-condition">Loading...</h3>
                <p id="weather-details">-- • Wind: --</p>
            </div>
            <div class="weather-status">
                <p id="travel-conditions">Checking conditions</p>
            </div>
        </div>

        <!-- Last Updated -->
        <div class="last-updated">
            Updated <span id="last-update">--</span> ago • <span class="refresh-btn" onclick="forceRefresh()">Tap to refresh</span>
        </div>
    </div>

    <!-- Detail View (hidden by default) -->
    <div class="container detail-view" id="detail-view" style="display: none;">
        <div class="status-bar">
            <span id="detail-time">--:--</span>
            <span>WiFi • 100%</span>
        </div>

        <button class="back-btn" onclick="hideDetail()">← Back</button>

        <div class="detail-header" id="detail-header">
            <!-- Will be populated dynamically -->
        </div>

        <div class="detail-content" id="detail-content">
            <!-- Will be populated dynamically -->
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
